    <rect x="0.5" y="0.5" width="271" height="5" rx="2.5" fill="#D97706"/>
    <circle cx="240" cy="36" r="10" fill="none" stroke="#D97706" stroke-width="1.5" style="transform-box:fill-box;transform-origin:center;animation:ringPulse 2.8s ease-out infinite 1.9s;"/>
    <circle cx="240" cy="36" r="4" fill="#D97706"/>
    <text x="24" y="40" class="mono" font-size="11" font-weight="bold" fill="#D97706">STREAK</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 175" width="272" height="175">
  <style>
  .serif { font-family: Georgia, 'Times New Roman', serif; }
  .sans  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono  { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.6); }
    70%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes barGrow {
    from { transform: scaleY(0); }
    to   { transform: scaleY(1); }
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.45; transform: scale(1.35); }
  }
  @keyframes tileSpring {
    0%   { opacity: 0; transform: translateY(20px) rotate(-1.5deg); }
    70%  { opacity: 1; transform: translateY(-3px) rotate(0.4deg); }
    100% { opacity: 1; transform: translateY(0) rotate(0deg); }
  }
  @keyframes ringPulse {
    0%   { opacity: 0.5; transform: scale(0.8); }
    100% { opacity: 0; transform: scale(1.7); }
  }
  @keyframes arrowNudge {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(4px); }
  }
  @keyframes rowPrint {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
  <g style="opacity:0;transform-box:fill-box;transform-origin:center;animation:tileSpring 0.65s cubic-bezier(0.22,1,0.36,1) forwards 1.15s;">
    <rect x="0.5" y="0.5" width="271" height="174" rx="14" fill="#FAF8F5" stroke="#E5E0D8"/>
    <rect x="0.5" y="0.5" width="271" height="5" rx="2.5" fill="#2563EB"/>
    <circle cx="240" cy="36" r="10" fill="none" stroke="#2563EB" stroke-width="1.5" style="transform-box:fill-box;transform-origin:center;animation:ringPulse 2.8s ease-out infinite 1.65s;"/>
    <circle cx="240" cy="36" r="4" fill="#2563EB"/>
    <text x="24" y="40" class="mono" font-size="11" font-weight="bold" fill="#2563EB">BUILD</text>

rm:scaleY(0);animation:barGrow 0.45s cubic-bezier(0.22,1,0.36,1) forwards 1.14s;"/><text x="345.0" y="176" text-anchor="middle" class="mono" font-size="10" fill="#6E6A63">Jun</text><rect x="376" y="98.8" width="34" height="59.2" rx="4" fill="#D6D1C7" style="transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:barGrow 0.45s cubic-bezier(0.22,1,0.36,1) forwards 1.18s;"/><text x="393.0" y="176" text-anchor="middle" class="mono" font-size="10" fill="#6E6A63">Jul</text><rect x="424" y="99.8" width="34" height="58.2" rx="4" fill="#D6D1C7" style="transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:barGrow 0.45s cubic-bezier(0.22,1,0.36,1) forwards 1.22s;"/><text x="441.0" y="176" text-anchor="middle" class="mono" font-size="10" fill="#6E6A63">Aug</text><rect x="472" y="118.2" width="34" height="39.8" rx="4" fill="#D6D1C7" style="transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:barGrow 0.45s cubic-bezier(0.22,1,0.36,1) forwards 1.26s;"/><text x="489.0" y="176" text-anchor="middle" class="mono" font-size="10" fill="#6E6A63">Sep</text><rect x="520" y="74.0" width="34" height="84.0" rx="4" fill="#2563EB" style="transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:barGrow 0.45s cubic-bezier(0.22,1,0.36,1) forwards 1.3s;"/><text x="537.0" y="176" text-anchor="middle" class="mono" font-size="10" fill="#6E6A63">Oct</text><text x="537.0" y="67.0" text-anchor="middle" class="mono" font-size="10.5" font-weight="bold" fill="#2563EB" style="opacity:0;animation:fadeUp 0.3s ease forwards 1.65s;">78</text><rect x="568" y="125.7" width="34" height="32.3" rx="4" fill="#D6D1C7" style="transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:barGrow 0.45s cubic-bezier(0.22,1,0.36,1) forwards 1.34s;"/><text x="585.0" y="176" text-anchor="middle" class="mono" font-size="10" fill="#6E6A63">Nov</text>


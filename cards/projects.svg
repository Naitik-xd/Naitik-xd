<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="840" height="160">
  <style>
  .serif { font-family: Georgia, 'Times New Roman', serif; }
  .sans  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono  { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.6); }
    70%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes barGrow {
    from { transform: scaleY(0); }
    to   { transform: scaleY(1); }
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.45; transform: scale(1.35); }
  }
  @keyframes tileSpring {
    0%   { opacity: 0; transform: translateY(20px) rotate(-1.5deg); }
    70%  { opacity: 1; transform: translateY(-3px) rotate(0.4deg); }
    100% { opacity: 1; transform: translateY(0) rotate(0deg); }
  }
  @keyframes ringPulse {
    0%   { opacity: 0.5; transform: scale(0.8); }
    100% { opacity: 0; transform: scale(1.7); }
  }
  @keyframes arrowNudge {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(4px); }
  }
  @keyframes rowPrint {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
  <rect x="0.5" y="0.5" width="839" height="159" rx="14" fill="#FAF8F5" stroke="#E5E0D8"/>

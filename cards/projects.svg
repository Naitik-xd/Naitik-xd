          <circle cx="46" cy="76" r="4.5" fill="#2563EB"/>
          <text x="58" y="80" class="serif" font-size="17" fill="#1A1918">CurriculumCraft AI</text>
          <text x="44" y="106" class="sans" font-size="11.5" fill="#6E6A63">Gemma 4 CBSE paper & lesson generator</text>
          <text x="44" y="124" class="mono" font-size="10" fill="#2563EB">LIVE PROJECT ↗</text>

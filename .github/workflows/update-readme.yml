name: Refresh README SVG Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch GitHub contributions
        run: python scripts/fetch_contributions.py

      - name: Render animated SVG cards
        run: python scripts/render_readme_cards.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ cards/
          git diff --staged --quiet || git commit -m "chore: refresh README SVG cards [skip ci]"
          git push
